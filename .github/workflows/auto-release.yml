name: auto-release
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
      - run: python -m pip install --upgrade pip build python-semantic-release
      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish
